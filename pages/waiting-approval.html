<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pendingApproval">Account Pending - Akram Academy</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light flex items-center justify-center min-vh-100">
    <div class="glass-card text-center" style="max-width: 500px; padding: 4rem; border-radius: 30px;">
        <div class="mb-6 text-primary" style="font-size: 3.5rem;">
            <i class="fas fa-graduation-cap"></i>
        </div>
        
        <div class="mb-6" style="color: var(--warning); font-size: 3rem;">
            <i class="fas fa-user-clock fa-spin" style="--fa-animation-duration: 3s;"></i>
        </div>

        <h1 class="mb-4 text-2xl font-bold" data-i18n="pendingApproval">Pending Approval</h1>
        
        <p class="text-muted mb-8 text-lg" data-i18n="pendingMsg">
            Your academic account has been created successfully. For security reasons, an administrator must verify your credentials before you can access the platform.
        </p>

        <div class="flex flex-col gap-4">
            <button onclick="location.reload()" class="btn btn-primary py-4 text-lg shadow-lg">
                <i class="fas fa-sync-alt"></i> <span data-i18n="checkStatus">Check Status</span>
            </button>
            <button id="logoutBtn" class="btn btn-outline py-3">
                <i class="fas fa-sign-out-alt"></i> <span data-i18n="logout">Sign Out</span>
            </button>
        </div>
        
        <div class="mt-10 pt-6 border-t border-border">
            <p class="text-xs text-muted">Akram Academy &copy; 2026. All rights reserved.</p>
        </div>
    </div>

    <script type="module">
        import i18n from '../js/i18n.js';
        import { supabase } from '../js/services/supabase.js';

        let userId = null;

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { window.location.href = '../login.html'; return; }
            userId = user.id;

            // Check current status immediately
            await checkAndRedirect();

            // ✅ Realtime subscription — no polling needed
            const channel = supabase
                .channel(`approval-watch-${userId}`)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'profiles',
                    filter: `id=eq.${userId}`
                }, (payload) => {
                    if (payload.new.status === 'approved') {
                        showApprovedAnimation(payload.new.role);
                    }
                })
                .subscribe();

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await channel.unsubscribe();
                await supabase.auth.signOut();
                window.location.href = '../login.html';
            });

            i18n.updateDOM();
        }

        async function checkAndRedirect() {
            const { data: profile } = await supabase
                .from('profiles')
                .select('status, role')
                .eq('id', userId)
                .single();

            if (profile && profile.status === 'approved') {
                showApprovedAnimation(profile.role);
            }
        }

        function showApprovedAnimation(role) {
            const card = document.querySelector('.glass-card');
            card.innerHTML = `
                <div class="mb-6" style="color: var(--success); font-size: 4rem; animation: bounceIn 0.6s ease;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 style="color: var(--success); font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem;">
                    ✅ Account Approved!
                </h2>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">
                    Redirecting you to your dashboard...
                </p>
                <div style="width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;">
                    <div style="height: 100%; background: var(--success); animation: progressBar 1.5s ease-out forwards;"></div>
                </div>
                <style>
                    @keyframes bounceIn { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
                    @keyframes progressBar { from { width: 0; } to { width: 100%; } }
                </style>
            `;
            setTimeout(() => {
                window.location.href = `../dashboard/${role}.html`;
            }, 1600);
        }

        init();
    </script>
</body>
</html>
