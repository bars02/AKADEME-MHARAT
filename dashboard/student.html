<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="studentDashboard">Student Dashboard - Akram Academy</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .device-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .device-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .device-image {
            height: 160px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }
        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 1s ease-in-out;
        }
    </style>
</head>
<body class="bg-light">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo mb-10">
                <i class="fas fa-graduation-cap"></i>
                <span data-i18n="appName">Akram Academy</span>
            </div>
            
            <nav>
                <a href="#" class="nav-link active">
                    <i class="fas fa-th-large"></i>
                    <span data-i18n="overview">Overview</span>
                </a>
                <a href="#" class="nav-link">
                    <i class="fas fa-book"></i>
                    <span data-i18n="myCourses">My Courses</span>
                </a>
                <a href="#" class="nav-link">
                    <i class="fas fa-file-alt"></i>
                    <span data-i18n="exams">Exams</span>
                </a>
                <a href="#" class="nav-link">
                    <i class="fas fa-certificate"></i>
                    <span data-i18n="certificates">Certificates</span>
                </a>
                <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem;">
                    <a href="#" class="nav-link">
                        <i class="fas fa-user"></i>
                        <span data-i18n="profile">Profile</span>
                    </a>
                    <a href="#" class="nav-link">
                        <i class="fas fa-cog"></i>
                        <span data-i18n="settings">Settings</span>
                    </a>
                    <button id="logoutBtn" class="nav-link w-full" style="background: none; border: none; cursor: pointer; color: var(--danger);">
                        <i class="fas fa-sign-out-alt"></i>
                        <span data-i18n="logout">Sign Out</span>
                    </button>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="flex items-center gap-4">
                    <button id="mobileMenuBtn" class="btn btn-outline btn-sm mobile-only">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="search-bar">
                        <i class="fas fa-search" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="text" data-i18n="searchPlaceholder" placeholder="Search for courses...">
                    </div>
                </div>
                <div class="flex gap-4 items-center mt-4 md:mt-0">
                    <button id="langToggle" class="btn btn-outline btn-sm" data-i18n="switchLang">العربية</button>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <div id="userName" class="font-bold">Student Name</div>
                            <div id="deptName" class="text-xs text-muted">Department</div>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold">
                            <span id="userInitial">S</span>
                        </div>
                    </div>
                </div>
            </header>

            <section class="mb-10">
                <h1 class="text-2xl mb-2"><span data-i18n="welcomeBack">Welcome back,</span> <span id="welcomeName">Student</span>!</h1>
                <p class="text-muted" data-i18n="heroSub">Start your learning journey today.</p>
            </section>

            <!-- Stats Grid -->
            <div class="grid grid-cols-3 gap-6 mb-12">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(37, 99, 235, 0.1); color: var(--primary);">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div>
                        <div class="text-2xl font-bold" id="progressPct">0%</div>
                        <div class="text-sm text-muted" data-i18n="overallProgress">Overall Progress</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(16, 185, 129, 0.1); color: var(--success);">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div>
                        <div class="text-2xl font-bold" id="completedCount">0</div>
                        <div class="text-sm text-muted" data-i18n="devicesMastered">Completed</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(245, 158, 11, 0.1); color: var(--warning);">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div>
                        <div class="text-2xl font-bold" id="pendingReviews">0</div>
                        <div class="text-sm text-muted" data-i18n="examsPending">Pending Review</div>
                    </div>
                </div>
            </div>

            <!-- Devices/Courses Section -->
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold" data-i18n="availableDevices">Available Devices</h2>
                <a href="#" class="text-primary font-medium" data-i18n="learnMore">View All</a>
            </div>
            
            <div id="deviceGrid" class="grid grid-cols-3 gap-8 mb-12">
                <!-- Dynamic Content -->
            </div>

            <!-- Recent Activity / Results -->
            <section class="mt-16">
                <h2 class="text-xl font-bold mb-6" data-i18n="myResults">My Results</h2>
                <div class="glass-card p-0 overflow-hidden">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th data-i18n="name">Device</th>
                                <th data-i18n="results">Score</th>
                                <th data-i18n="status">Status</th>
                                <th data-i18n="actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="resTable">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module">
        import i18n from '../js/i18n.js';
        import { routing } from '../js/services/routing.js';
        import { supabase } from '../js/services/supabase.js';

        async function init() {
            const profile = await routing.checkAccess(['student']);
            if (!profile) return;

            // UI Updates
            document.getElementById('userName').textContent = profile.name || 'Student';
            document.getElementById('welcomeName').textContent = (profile.name || 'Student').split(' ')[0];
            document.getElementById('userInitial').textContent = (profile.name || 'S').charAt(0);

            const { data: dept } = await supabase.from('departments').select('name').eq('id', profile.department_id).single();
            document.getElementById('deptName').textContent = dept?.name || 'Unassigned';

            loadDevices(profile.department_id);
            loadStats(profile.id);
            setupMobileMenu();
            i18n.updateDOM();
            
            // Handle RTL specific adjustments if needed
            if (i18n.lang === 'ar') {
                document.querySelector('.search-bar i').style.left = 'auto';
                document.querySelector('.search-bar i').style.right = '1rem';
            }
        }

        // Setup Mobile Menu
        function setupMobileMenu() {
            const btn = document.getElementById('mobileMenuBtn');
            const sidebar = document.getElementById('sidebar');
            btn.onclick = () => sidebar.classList.toggle('open');
            document.querySelectorAll('.nav-link').forEach(l => {
                l.addEventListener('click', () => {
                    if (window.innerWidth <= 768) sidebar.classList.remove('open');
                });
            });
        }

        async function loadDevices(deptId) {
            const { data: devices } = await supabase.from('devices').select('*').eq('department_id', deptId);
            const grid = document.getElementById('deviceGrid');
            grid.innerHTML = '';

            if (!devices || devices.length === 0) {
                grid.innerHTML = '<p class="text-muted">No devices available for your department.</p>';
                return;
            }

            devices.forEach(d => {
                const card = document.createElement('div');
                card.className = 'device-card';
                card.innerHTML = `
                    <div class="device-image">
                        <i class="fas fa-microscope"></i>
                    </div>
                    <div class="p-6">
                        <h3 class="mb-2 text-lg">${d.name}</h3>
                        <p class="text-sm text-muted mb-4">${d.description || 'Professional training module'}</p>
                        <div class="mb-4">
                            <div class="flex justify-between text-xs mb-1">
                                <span>Progress</span>
                                <span>0%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 0%"></div>
                            </div>
                        </div>
                        <a href="../pages/device-details.html?id=${d.id}" class="btn btn-primary w-full" data-i18n="entryLab">Enter Lab</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function loadStats(uid) {
            const { data: results } = await supabase.from('results').select('*, exams(devices(name))').eq('user_id', uid);
            const tbody = document.getElementById('resTable');
            tbody.innerHTML = '';

            if (!results || results.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No results found</td></tr>';
                return;
            }

            const appCount = results.filter(r => r.status === 'approved').length;
            const pendCount = results.filter(r => r.status === 'pending_review').length;

            document.getElementById('completedCount').textContent = appCount;
            document.getElementById('pendingReviews').textContent = pendCount;
            document.getElementById('progressPct').textContent = `${Math.min(100, appCount * 20)}%`;

            results.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="font-medium">${r.exams?.devices?.name || 'Device'}</td>
                    <td><span class="font-bold text-primary">${r.score}%</span></td>
                    <td><span class="badge ${r.status}">${i18n.t(r.status)}</span></td>
                    <td>
                        <button class="btn btn-outline btn-sm">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('logoutBtn').onclick = () => routing.logout();
        document.getElementById('langToggle').onclick = () => i18n.toggle();

        init();
    </script>
</body>
</html>
