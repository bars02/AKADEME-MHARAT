<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login">Login - Akram Academy</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light flex items-center justify-center min-vh-100">
    <div class="glass-card" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-6">
            <a href="index.html" class="text-primary mb-4 block" style="font-size: 2rem;"><i class="fas fa-graduation-cap"></i></a>
            <h1 data-i18n="login">Login</h1>
            <p class="text-muted" data-i18n="loginSub">Welcome back</p>
        </div>

        <form id="logForm" class="grid gap-4">
            <div class="form-group">
                <label data-i18n="academicEmail">Email</label>
                <input type="email" id="email" class="form-input" required>
            </div>
            <div class="form-group">
                <label data-i18n="password">Password</label>
                <input type="password" id="pass" class="form-input" required>
            </div>
            <button type="submit" id="subBtn" class="btn btn-primary w-full py-3" data-i18n="login">Login</button>
        </form>
        <p class="text-center mt-4"><span data-i18n="noAccount">New?</span> <a href="register.html" data-i18n="register">Register</a></p>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module">
        import i18n from './js/i18n.js';
        import { supabase } from './js/services/supabase.js';
        import { ui } from './js/services/ui.js';

        document.getElementById('logForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            ui.setLoading(btn, true);

            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                ui.toast(error.message, 'error');
                ui.setLoading(btn, false);
            } else {
                const { data: profile } = await supabase.from('profiles').select('role, status').eq('id', data.user.id).single();
                if (profile && profile.status === 'approved') {
                    window.location.href = `./dashboard/${profile.role}.html`;
                } else {
                    window.location.href = `./pages/waiting-approval.html`;
                }
            }
        };

        i18n.updateDOM();
    </script>
</body>
</html>
