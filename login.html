<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.groq.com; media-src 'self' blob: https:; frame-src blob: https://www.youtube.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login">Login - Akram Academy</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">
    <div class="auth-layout">
        <!-- Visual Background Side -->
        <div class="auth-visual">
            <canvas id="particles-bg"></canvas>
            <div class="auth-visual-content">
                <a href="index.html" class="logo-medical mb-6" style="justify-content: center; text-decoration: none;">
                    <div class="pulse-icon"><i class="fas fa-microscope"></i></div>
                    <span class="brand-text">Maharat</span>
                </a>
                <h1 data-i18n="welcomeBackHeading">Welcome Back</h1>
                <p data-i18n="loginSub">Enter your specialized academic environment and continue shaping the medical
                    future.</p>
            </div>
        </div>

        <!-- Form Side -->
        <div class="auth-form-wrapper">
            <div class="auth-glass-card">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold mb-2" data-i18n="login">Login</h2>
                    <p class="text-muted text-sm" data-i18n="loginSub">Access your dashboard</p>
                </div>

                <form id="logForm" class="grid gap-5">
                    <div class="form-group">
                        <label data-i18n="academicEmail">Email</label>
                        <input type="email" id="email" class="form-input" required placeholder="name@domain.com">
                    </div>
                    <div class="form-group">
                        <label data-i18n="password">Password</label>
                        <input type="password" id="pass" class="form-input" required
                            placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢">
                    </div>
                    <button type="submit" id="subBtn" class="btn btn-primary w-full py-3 mt-2"
                        style="font-size: 1rem;"><i class="fas fa-sign-in-alt"></i> <span
                            data-i18n="login">Login</span></button>
                </form>

                <p class="text-center mt-6 text-sm text-muted">
                    <span data-i18n="noAccount">New?</span>
                    <a href="register.html" class="text-primary font-bold hover:underline"
                        data-i18n="register">Register</a>
                </p>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script type="module" src="js/particles-bg.js" defer></script>
    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.ParticleNetwork) new window.ParticleNetwork('particles-bg');
        });
    </script>
    <script type="module">
        import { initAIWidget } from '/js/ai-widget.js';
        initAIWidget();
    </script>

    <script type="module">
        import i18n from './js/i18n.js';
        import { supabase } from './js/services/supabase.js';
        import { ui } from './js/services/ui.js';

        document.getElementById('logForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            ui.setLoading(btn, true);

            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                ui.toast(error.message, 'error');
                ui.setLoading(btn, false);
            } else {
                const { data: profile } = await supabase.from('profiles').select('role, status').eq('id', data.user.id).single();
                if (profile && profile.status === 'approved') {
                    window.location.href = `./dashboard/${profile.role}.html`;
                } else {
                    window.location.href = `./pages/waiting-approval.html`;
                }
            }
        };

        i18n.updateDOM();
    </script>
</body>

</html>
